# Weekly dependency update PRs. Each one runs the full CI (lint, types, build,
# E2E on the Docker image) but never deploys: only merges to main do.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # Types must match the runtime (Node 22: .nvmrc, Docker image). Bump the
      # major together with a deliberate runtime upgrade, never on its own.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # One PR for all non-breaking updates instead of one per package.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
