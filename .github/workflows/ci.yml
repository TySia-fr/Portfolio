name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

# Cancel an older run when a newer commit is pushed to the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; jobs that need more ask for it explicitly.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/tysia-fr/portfolio

jobs:
  check:
    name: Lint, format, types, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from package.json#packageManager.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Production build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  image:
    name: Docker image (build, smoke test, publish)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # push to GitHub Container Registry
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true # keep it in the runner's Docker for the smoke test
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Runs the exact production compose file with the exact hardening flags.
      - name: Smoke test with production compose file
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker compose -f deploy/compose.yaml up -d --pull never
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' portfolio)
            echo "health: $status"
            [ "$status" = "healthy" ] && break
            sleep 2
          done
          [ "$status" = "healthy" ] || { docker logs portfolio; exit 1; }

          headers=$(curl -fsS -D - -o /tmp/body.html http://127.0.0.1:3001/)
          echo "$headers"
          echo "$headers" | grep -qi '^x-frame-options: DENY'
          echo "$headers" | grep -qi '^x-content-type-options: nosniff'
          ! echo "$headers" | grep -qi '^x-powered-by'
          grep -q '<html lang="fr"' /tmp/body.html
          # The spec sheet must show the commit this image was built from.
          grep -q "${GITHUB_SHA:0:7}" /tmp/body.html
          echo "user: $(docker exec portfolio id -u) (must not be 0)"
          [ "$(docker exec portfolio id -u)" != "0" ]
          docker compose -f deploy/compose.yaml down

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  deploy:
    name: Deploy to VPS
    needs: image
    # Stays skipped until the server is ready and the repository variable
    # DEPLOY_ENABLED is set to "true" (Settings → Secrets and variables → Actions).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://portfolio.siavashizadi.com
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key: refuse to talk to an impostor server.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      # The server ignores the command text except as the tag argument:
      # the key is locked to deploy.sh by a forced command.
      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "deployer@${DEPLOY_HOST}" "${{ github.sha }}"

      - name: Verify public URL
        run: |
          sleep 3
          curl -fsS -o /dev/null -w "HTTP %{http_code}\n" https://portfolio.siavashizadi.com/
