# /etc/nginx/sites-available/portfolio.siavashizadi.com
# HTTP-only on purpose: `certbot --nginx` adds the HTTPS server block,
# the certificate paths and the HTTP→HTTPS redirect to this file.

upstream portfolio_app {
    server 127.0.0.1:3001;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name portfolio.siavashizadi.com;

    # The biggest legitimate request is the contact form. Reject anything larger
    # before it reaches Node.
    client_max_body_size 64k;

    location / {
        proxy_pass http://portfolio_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Tell the app who the real client is (Nginx is the only hop).
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }
}
