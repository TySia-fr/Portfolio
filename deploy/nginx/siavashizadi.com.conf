# /etc/nginx/sites-available/siavashizadi.com
#
# HTTP-only on purpose: `certbot --nginx -d siavashizadi.com -d www.siavashizadi.com`
# adds the HTTPS listeners, the certificate paths and the HTTP→HTTPS redirects.
# Other projects get their own file with their own server_name (subdomains).

upstream portfolio_app {
    server 127.0.0.1:3001;
    keepalive 16;
}

# www → apex: one canonical address for search engines and visitors.
server {
    listen 80;
    listen [::]:80;
    server_name www.siavashizadi.com;

    return 301 https://siavashizadi.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name siavashizadi.com;

    # The biggest legitimate request is the contact form. Reject anything larger
    # before it reaches Node.
    client_max_body_size 64k;

    # Do not advertise the Nginx version in headers and error pages.
    server_tokens off;

    location / {
        proxy_pass http://portfolio_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Tell the app who the real client is (Nginx is the only hop).
        # $remote_addr, not $proxy_add_x_forwarded_for: a client must not be
        # able to inject its own X-Forwarded-For value.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }
}
